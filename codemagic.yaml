workflows:
  android-debug:
    name: SMS App - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Android SDK yolunu qeyd et
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Rəsmi Gradle wrapper faylını yoxlayaraq endir
        script: |
          mkdir -p gradle/wrapper
          curl --fail --location --retry 3 --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.13-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | shasum -a 256 -c -
      - name: Android debug APK yarat
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
